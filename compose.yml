services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: shelfstack-web:dev
    command: bash -lc "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle:/bundle
    ports:
      - "3000:3000"
    # Chromium in Docker needs more than the default 64MB /dev/shm.
    shm_size: "256mb"
    # Gate 8b Slice 2: loads operator-provided provider API keys
    # (SHELFSTACK_ISBNDB_API_KEY, optional SHELFSTACK_GOOGLE_BOOKS_API_KEY)
    # from a gitignored repo-root .env into the container as plain ENV --
    # no dotenv gem. `required: false` means a missing .env does not break
    # `docker compose up` (see docs/implementation/bootstrap-and-seed.md).
    env_file:
      - path: .env
        required: false
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: shelfstack_development
      TEST_DATABASE_NAME: shelfstack_test
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    depends_on:
      - db
    stdin_open: true
    tty: true

  db:
    image: postgres:17-bookworm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shelfstack_development
    ports:
      - "5432:5432"

volumes:
  bundle:
  postgres-data:

